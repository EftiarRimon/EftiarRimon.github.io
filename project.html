<!doctype html>
<html lang="en" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#171717;--ink:#f7f7f7;--muted:#b5b5b5;--line:rgba(255,255,255,.15);--max:1240px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:110px}
    body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.05;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:48px 48px}
    a{color:inherit;text-decoration:none}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}img{max-width:100%}:focus-visible{outline:3px solid #fff;outline-offset:4px}
    .wrap{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
    .site-header{position:fixed;z-index:100;top:16px;left:50%;transform:translateX(-50%);width:min(1360px,calc(100% - 40px))}
    .nav-wrap{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:22px;padding:0 18px 0 25px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(14,14,14,.76);backdrop-filter:blur(24px) saturate(130%);box-shadow:0 12px 50px rgba(0,0,0,.22)}
    .brand{font:600 1.08rem "Space Grotesk",sans-serif;letter-spacing:-.035em;white-space:nowrap}
    .brand em{font-style:normal;color:#a9a9a9}
    .nav-links{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.3vw,20px)}
    .nav-links a{padding:9px 10px;border-radius:999px;color:#dedede;font-size:.9rem;transition:background .2s,color .2s}
    .nav-links a:hover{background:rgba(255,255,255,.09);color:#fff}
    .nav-actions{display:flex;align-items:center;gap:9px}
    .nav-icon,.menu-toggle{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;border:1px solid rgba(255,255,255,.07);border-radius:50%;color:#fff;background:rgba(255,255,255,.09)}
    .nav-icon svg{width:19px;height:19px}
    .menu-toggle{display:none;cursor:pointer}
    .menu-toggle span{display:block;width:16px;height:1.5px;margin:2.5px auto;background:#fff}
    .nav-links.is-open{position:absolute;top:80px;right:0;display:flex;flex-direction:column;align-items:stretch;width:min(310px,calc(100vw - 32px));padding:12px;border:1px solid var(--line);border-radius:22px;background:rgba(18,18,18,.96);backdrop-filter:blur(24px)}
    .nav-links.is-open a{padding:12px 14px}
    main{padding-top:120px}
    .case-topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:18px 0 28px;color:#aaa;font:500 .72rem "DM Mono",monospace;letter-spacing:.13em;text-transform:uppercase}
    .back-link{display:inline-flex;align-items:center;gap:9px;color:#eee;letter-spacing:0;text-transform:none;font:500 .9rem "DM Sans",sans-serif}
    .back-link span{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;transition:transform .2s,background .2s}
    .back-link:hover span{transform:translateX(-3px);background:#222}
    .case-hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr);align-items:center;gap:clamp(30px,5vw,72px);padding:16px 0 60px}
    .case-media{position:relative;min-height:390px;aspect-ratio:1.25/1;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:25px;background:radial-gradient(ellipse at 60% 30%,rgba(255,255,255,.11),transparent 60%),#151515;box-shadow:0 30px 90px rgba(0,0,0,.35)}
    .case-intro .eyebrow{margin:0 0 18px;color:#aaa;font:500 .72rem "DM Mono",monospace;letter-spacing:.16em;text-transform:uppercase}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:22px;font:500 clamp(2.7rem,5.4vw,5.4rem)/.99 "Space Grotesk",sans-serif;letter-spacing:-.065em}
    .summary{color:#c4c4c4;font-size:clamp(1rem,1.5vw,1.16rem);line-height:1.85}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:23px 0 26px}
    .tags span{padding:6px 11px;border:1px solid rgba(255,255,255,.17);border-radius:999px;color:#e2e2e2;background:rgba(255,255,255,.035);font-size:.78rem}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:11px 19px;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:#f7f7f7;background:rgba(255,255,255,.045);font-size:.9rem;transition:transform .2s,background .2s}
    .btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
    .btn-primary{color:#111;background:#f4f4f4;border-color:#f4f4f4}
    .btn-primary:hover{color:#111;background:#ddd}
    .case-divider{height:1px;background:var(--line);margin:12px 0 0}
    .case-details{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:clamp(30px,7vw,110px);padding:60px 0 72px}
    .section-label{margin-bottom:17px;color:#aaa;font:500 .72rem "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase}
    h2{margin-bottom:18px;font:500 clamp(1.8rem,3vw,2.8rem)/1.1 "Space Grotesk",sans-serif;letter-spacing:-.045em}
    .overview p,.learning p{max-width:760px;color:#bdbdbd;line-height:1.9}
    .facts{align-self:start;border:1px solid var(--line);border-radius:20px;background:#111;padding:23px}
    .fact{padding:15px 0;border-bottom:1px solid rgba(255,255,255,.1)}
    .fact:first-child{padding-top:0}.fact:last-child{border-bottom:0;padding-bottom:0}
    .fact span{display:block;margin-bottom:5px;color:#8f8f8f;font:500 .68rem "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
    .fact strong{font-size:.96rem;font-weight:500}
    .features-section{padding:64px 0 76px;border-top:1px solid var(--line);background:linear-gradient(180deg,#101010,#080808)}
    .features-head{max-width:680px;margin-bottom:30px}
    .features-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .feature{display:flex;align-items:flex-start;gap:14px;padding:19px;border:1px solid rgba(255,255,255,.11);border-radius:17px;background:rgba(255,255,255,.025)}
    .feature-num{display:grid;place-items:center;width:32px;height:32px;flex:0 0 auto;border:1px solid rgba(255,255,255,.18);border-radius:50%;color:#ddd;font:500 .7rem "DM Mono",monospace}
    .feature p{margin:2px 0 0;color:#ddd}
    .learning{padding:64px 0 82px}
    .learning-card{max-width:850px;padding:clamp(22px,4vw,42px);border:1px solid var(--line);border-radius:22px;background:#111}
    .learning-card p:last-child{margin-bottom:0}
    .case-footer{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:24px 0 35px;border-top:1px solid var(--line);color:#999;font-size:.86rem}
    .case-footer a{color:#eee}
    .case-footer a:hover{text-decoration:underline}
    .flow-visual{height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(15px,3vw,34px);background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.07),transparent 65%)}
    .visual-kicker{margin:0 0 22px;color:#a4a4a4;font:500 .65rem "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
    .flow-steps{display:flex;align-items:stretch;gap:8px}
    .flow-step{display:grid;place-items:center;flex:1;min-height:68px;padding:10px 5px;border:1px solid rgba(255,255,255,.17);border-radius:12px;background:rgba(255,255,255,.045);color:#eee;text-align:center;font-size:clamp(.63rem,1vw,.85rem)}
    .flow-arrow{align-self:center;color:#999;font-size:1rem}
    .flow-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0 33%}
    .flow-foot span{padding:11px;border:1px solid rgba(255,255,255,.13);border-radius:10px;color:#ccc;text-align:center;font-size:.77rem}
    .media-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;height:100%;padding:12px}
    .media-gallery figure{min-width:0;height:100%;margin:0;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:#101010}
    .media-gallery img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
    .media-label{position:absolute;right:15px;bottom:14px;padding:5px 9px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(0,0,0,.72);color:#ccc;font:500 .61rem "DM Mono",monospace}
    .mock-dashboard{height:100%;padding:24px;background:linear-gradient(145deg,#171717,#0b0b0b)}
    .mock-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);color:#e8e8e8;font-size:.75rem}
    .mock-top span{color:#999;font:500 .62rem "DM Mono",monospace}
    .mock-title{margin:24px 0 17px;font:500 clamp(1rem,2vw,1.65rem) "Space Grotesk",sans-serif}
    .mock-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .mock-stats div{padding:12px 9px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:rgba(255,255,255,.035)}
    .mock-stats b{display:block;font-size:clamp(1rem,2vw,1.45rem)}
    .mock-stats small{color:#999;font-size:.65rem}
    .mock-table{margin-top:15px;border:1px solid rgba(255,255,255,.1);border-radius:11px;overflow:hidden}
    .mock-row{display:grid;grid-template-columns:1.3fr 1fr .6fr;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07);color:#aaa;font-size:.68rem}
    .mock-row:last-child{border-bottom:0}.mock-row:first-child{color:#eee;background:rgba(255,255,255,.04)}
    .process-visual{height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(16px,3vw,34px);background:radial-gradient(ellipse at 80% 20%,rgba(255,255,255,.08),transparent 55%),#101010}
    .process-node{padding:18px 12px;border:1px solid rgba(255,255,255,.17);border-radius:13px;background:rgba(255,255,255,.045);text-align:center}
    .process-node strong{display:block;font:500 clamp(.85rem,1.6vw,1.2rem) "Space Grotesk",sans-serif}
    .process-node small{display:block;margin-top:5px;color:#aaa;font-size:.75rem}
    .process-arrow{text-align:center;color:#aaa;font-size:1.2rem;line-height:1.8}
    .not-found{padding:90px 0 140px;text-align:center}
    .not-found h1{font-size:clamp(2.5rem,6vw,4rem)}
    footer{padding:20px 0 35px;color:#777;font-size:.82rem}
    @media(max-width:900px){.case-hero{grid-template-columns:1fr;gap:28px}.case-media{order:2;min-height:300px;aspect-ratio:1.35/1}.case-intro{order:1}.case-details{grid-template-columns:1fr;gap:28px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}.fact:nth-child(2){border-bottom:1px solid rgba(255,255,255,.1)}}
    @media(max-width:720px){.wrap{width:calc(100% - 28px)}.site-header{top:10px;width:calc(100% - 24px)}.nav-wrap{min-height:61px;padding-inline:15px}.brand{font-size:.95rem}.nav-icon,.menu-toggle{width:38px;height:38px}.menu-toggle{display:block}.nav-links{display:none}.nav-links.is-open{display:flex}.case-topline{margin:14px 0 22px;font-size:.61rem;letter-spacing:.08em}.case-hero{padding-bottom:40px}.case-media{min-height:250px;aspect-ratio:1.08/1;border-radius:18px}.case-details{padding:40px 0 48px}.facts{grid-template-columns:1fr}.fact:nth-child(2){border-bottom:0}.features-section,.learning{padding:45px 0 50px}.features-grid{grid-template-columns:1fr}.media-gallery{gap:5px;padding:7px}.flow-steps{gap:4px}.flow-step{min-height:60px;padding:6px 3px;font-size:.61rem}.flow-arrow{font-size:.7rem}.flow-foot{margin-left:20%;gap:5px}.flow-foot span{font-size:.64rem;padding:8px 4px}.mock-dashboard{padding:13px}.mock-title{margin:17px 0 12px}.mock-stats{gap:5px}.mock-stats div{padding:9px 5px}.mock-stats small{font-size:.56rem}.mock-row{padding:8px 7px;font-size:.58rem}.case-footer{align-items:flex-start;flex-direction:column}.actions .btn{flex:1}.site-header .nav-links.is-open{right:0}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="site-header">

      </nav>

        <a class="nav-icon" href="mailto:bsse1355@iit.du.ac.bd" aria-label="Email Eftiare Ahmed Rimon" title="Email"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="m5 7 7 5.5L19 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>

  <main class="wrap" id="mainContent">
    <div class="case-topline"><a class="back-link" href="./index.html#work"><span aria-hidden="true">←</span> All projects</a><span id="caseNumber">CASE STUDY</span></div>
    <section class="case-hero" aria-labelledby="projectTitle">
      <div class="case-media" id="caseMedia" aria-label="Project preview"></div>
      <div class="case-intro">
        <p class="eyebrow" id="projectType"></p>
        <h1 id="projectTitle">Project case study</h1>
        <p class="summary" id="projectSummary"></p>
        <div class="tags" id="projectTags" aria-label="Technology stack"></div>
        <div class="actions" id="projectActions"></div>
      </div>
    </section>
    <div class="case-divider"></div>
    <section class="case-details" aria-label="Project overview and details">
      <article class="overview"><p class="section-label">01 / Overview</p><h2>What the project does</h2><div id="projectOverview"></div></article>
      <aside class="facts" id="projectFacts" aria-label="Project details"></aside>
    </section>
    <section class="features-section">
      <div class="wrap" style="padding:0">
        <div class="features-head"><p class="section-label">02 / Highlights</p><h2>Key features &amp; focus areas</h2></div>
        <div class="features-grid" id="projectFeatures"></div>
      </div>
    </section>
    <section class="learning">
      <div class="learning-card"><p class="section-label">03 / Engineering notes</p><h2>What I learned and would improve</h2><div id="projectLearning"></div></div>
    </section>
    <div class="case-footer"><span>© <span id="year"></span> Eftiare Ahmed Rimon</span><a href="./index.html#work">← Back to selected projects</a></div>
  </main>
  <script>
    (function(){
      const projects={
        "rate-limiter":{
          number:"01 / 05",type:"Systems engineering",title:"Rate Limiter & Load Balancer",
          summary:"A containerized, fault-tolerant system combining rate limiting, load balancing, object storage, and persistence to protect services under load.",
          overview:["This project brings request throttling and traffic distribution into one system. Requests pass through an API gateway and rate limiter before being distributed to backend service instances.","The supporting storage layer uses MySQL for persistence and MinIO for object storage. The diagram is a conceptual view of the request path, not a performance benchmark."],
          role:"Systems engineer",stack:["Node.js","Docker","MinIO","MySQL"],features:["Request throttling to control incoming traffic","Load balancing across backend service instances","MySQL persistence","MinIO object storage","Containerized system components"],
          learning:"Rate limits need explicit policies and predictable overload behavior. I would add load tests and failure-injection tests before making resilience claims.",
          visual:"flow",flow:["Client","API gateway","Rate limiter","Load balancer","Backend services"],foot:["MySQL persistence","MinIO object storage"],demo:null,repo:null
        },
        "dhaka-tesla-pool":{
          number:"02 / 05",type:"Full-stack product",title:"Dhaka Tesla Pool",
          summary:"A bilingual ride-sharing flow that helps Tesla owners share spare seats and lets passengers split daily commute fares.",
          overview:["The product has separate passenger and driver journeys, bringing ride discovery and seat booking into a shared experience.","The interface supports Bangla and English. The project focuses on seat booking, fare splitting, and distinct flows for people offering rides and people looking for a seat."],
          role:"Full-stack product",stack:["Next.js","Node.js","MySQL","Role-based auth","Vercel"],features:["Separate passenger and driver journeys","Seat booking","Fare splitting for daily commutes","Bangla and English interface","Live demo and source repository"],
          learning:"Booking flows need clear state transitions and consistent seat availability. I would add concurrency tests and broader end-to-end coverage.",
          visual:"tesla",images:[["./tesla-pool-login.png","Dhaka Tesla Pool sign-in screen"],["./tesla-pool-passenger-dashboard.png","Dhaka Tesla Pool passenger dashboard"],["./tesla-pool-driver-dashboard.png","Dhaka Tesla Pool driver dashboard"]],demo:"https://dhaka-tesla-pool-jade.vercel.app",repo:"https://github.com/EftiarRimon/dhaka-tesla-pool"
        },
        "mit-student-portal":{
          number:"03 / 05",type:"Web application",title:"MIT Student Portal",
          summary:"A role-based university portal for 200+ users, bringing courses, enrollment, payments, and results into one workflow.",
          overview:["The portal centralizes key student and administrative workflows, including courses, enrollment, payments, and results.","The project uses server-side role-based access controls as a core design concern. The visual shown here is an illustrative dashboard, not a captured product screenshot."],
          role:"Solo developer",stack:["Next.js","Node.js","Prisma","MySQL","JWT"],features:["Role-based access","Course and enrollment workflows","Payment workflow","Results management","Shared portal serving 200+ users"],
          learning:"Role-based access needs server-side checks at each workflow boundary. I would strengthen automated integration tests for enrollment and payments.",
          visual:"portal",demo:null,repo:"https://github.com/EftiarRimon/MIT-PORTAL"
        },
        "monolith-to-distributed":{
          number:"04 / 05",type:"Architecture",title:"Monolith to Distributed",
          summary:"A team project exploring the trade-offs of scaling a Stack Overflow-style Q&A platform from a monolith toward distributed services.",
          overview:["The work involved building a monolithic Q&A-style application and exploring a migration toward distributed services as a team.","The focus is on architecture and trade-offs: service boundaries can support independent evolution, but also add deployment, debugging, and observability overhead. The flow shown here is conceptual."],
          role:"Team engineer",stack:["JavaScript","Node.js","Express","Distributed systems"],features:["Stack Overflow-style Q&A domain","Monolithic starting point","Exploration of service boundaries","Trade-offs of distributed architecture","Team-based engineering"],
          learning:"Distributed services add deployment and observability overhead. I would validate each service boundary with load tests and failure scenarios before splitting further.",
          visual:"monolith",demo:null,repo:"https://github.com/EftiarRimon/stackoverflow"
        },
        "text2code":{
          number:"05 / 05",type:"Applied machine learning",title:"Text2Code",
          summary:"A comparative sequence-to-sequence study converting natural-language descriptions into Python code with attention-based recurrent models.",
          overview:["This project compares attention-based recurrent sequence-to-sequence approaches for natural-language-to-Python code generation.","The model families include RNN, LSTM, and BiLSTM approaches with Bahdanau attention. A stronger evaluation would check generated-code syntax and execution, not just exact-match results."],
          role:"ML researcher",stack:["Python","PyTorch","RNN","LSTM","BiLSTM","Bahdanau attention"],features:["Natural-language input","Sequence-to-sequence code generation","Attention-based recurrent models","Comparison across RNN, LSTM, and BiLSTM","Python code output"],
          learning:"Exact-match scores alone do not show whether generated code works. I would add syntax checks and execution-based evaluation.",
          visual:"text2code",demo:null,repo:"https://github.com/EftiarRimon/Text2Code-Seq2Seq"
        }
      };
      const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const params=new URLSearchParams(window.location.search);
      const id=params.get("project");
      const project=projects[id];
      const menuToggle=document.getElementById("menuToggle");
      const navLinks=document.getElementById("navLinks");
      document.getElementById("year").textContent=new Date().getFullYear();
      menuToggle.addEventListener("click",function(){const open=navLinks.classList.toggle("is-open");menuToggle.setAttribute("aria-expanded",String(open));menuToggle.setAttribute("aria-label",open?"Close navigation menu":"Open navigation menu");});
      navLinks.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{navLinks.classList.remove("is-open");menuToggle.setAttribute("aria-expanded","false");}));
      if(!project){
        document.getElementById("mainContent").innerHTML='<section class="not-found"><p class="section-label">PROJECT NOT FOUND</p><h1>This case study does not exist.</h1><p style="color:#aaa">Choose a project from the portfolio gallery.</p><a class="btn btn-primary" href="./index.html#work">Back to projects ↗</a></section>';
        document.title="Project not found — Eftiare Ahmed Rimon";
        return;
      }
      document.title=project.title+" — Eftiare Ahmed Rimon";
      document.getElementById("caseNumber").textContent="CASE STUDY · "+project.number;
      document.getElementById("projectType").textContent=project.type;
      document.getElementById("projectTitle").textContent=project.title;
      document.getElementById("projectSummary").textContent=project.summary;
      document.getElementById("projectTags").innerHTML=project.stack.map(x=>"<span>"+escapeHtml(x)+"</span>").join("");
      document.getElementById("projectOverview").innerHTML=project.overview.map(p=>"<p>"+escapeHtml(p)+"</p>").join("");
      document.getElementById("projectFacts").innerHTML=[["Project type",project.type],["Role",project.role],["Stack",project.stack.join(" · ")],["Case study",project.number]].map(([label,value])=>'<div class="fact"><span>'+escapeHtml(label)+'</span><strong>'+escapeHtml(value)+'</strong></div>').join("");
      document.getElementById("projectFeatures").innerHTML=project.features.map((x,i)=>'<article class="feature"><span class="feature-num">'+String(i+1).padStart(2,"0")+'</span><p>'+escapeHtml(x)+'</p></article>').join("");
      document.getElementById("projectLearning").innerHTML="<p>"+escapeHtml(project.learning)+"</p>";
      const actions=[];
      if(project.demo)actions.push('<a class="btn btn-primary" href="'+escapeHtml(project.demo)+'" target="_blank" rel="noopener noreferrer">Visit live demo ↗</a>');
